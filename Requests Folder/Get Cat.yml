info:
  name: Get Cat
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrlCat}}/images/search?limit=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: size
      value: med
      type: query
      description: "[optional] thumb , small, med or full - small is perfect for Discord"
      disabled: true
    - name: mime_types
      value: jpg
      type: query
      description: "[optional] a comma separated string of types to return e.g. jpg,png for static, or gif for gifs"
      disabled: true
    - name: format
      value: json
      type: query
      description: "[optional] json | src"
      disabled: true
    - name: has_breeds
      value: "true"
      type: query
      description: "[optional] - only return images with breed data"
      disabled: true
    - name: order
      value: RANDOM
      type: query
      description: "[optional] default:RANDOM - RANDOM | ASC | DESC"
      disabled: true
    - name: page
      value: "0"
      type: query
      description: "[optional] paginate through results"
      disabled: true
    - name: limit
      value: "1"
      type: query
      description: "[optional] number of results to return, up to 25 with a valid API-Key"
  auth:
    type: apikey
    key: X-API-KEY
    value: "{{apiKeyCat}}"
    placement: header

runtime:
  scripts:
    - type: after-response
      code: |-
        //bru.setNextRequest(null);

        //const { endChain } = require("./chain-helper.js");
        //endChain(bru);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
