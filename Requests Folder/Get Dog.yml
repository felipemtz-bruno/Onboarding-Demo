info:
  name: Get Dog
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrlDog}}/images/search?limit=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: "1"
      type: query
      description: Maximum number of results to return (default 10)
    - name: page
      value: "0"
      type: query
      description: Zero-based page index
      disabled: true
    - name: order
      value: RANDOM
      type: query
      description: Sort order of the results
      disabled: true
    - name: species_id
      value: "1"
      type: query
      description: Filter images by species identifier
      disabled: true
    - name: breed_groups
      value: Toy,Hound
      type: query
      description: Comma-separated list of breed groups to include in the response
      disabled: true
    - name: exclude_breed_groups
      value: Mixed
      type: query
      description: Comma-separated list of breed groups to exclude from the response
      disabled: true
    - name: lang
      value: it
      type: query
      description: Return translated fields when available for the requested language code
      disabled: true
    - name: has_breeds
      value: "true"
      type: query
      description: Filter to images that have breed metadata
      disabled: true
    - name: include_breeds
      value: "false"
      type: query
      description: Include breed information in the response
      disabled: true
    - name: include_categories
      value: "true"
      type: query
      description: Include category information in the response
      disabled: true
    - name: account_id
      value: account-123
      type: query
      description: Return images belonging to this account
      disabled: true
    - name: breed_id
      value: "1"
      type: query
      description: Filter results by breed identifier
      disabled: true
    - name: sub_id
      value: my-custom-id
      type: query
      description: Filter results by sub identifier
      disabled: true
  auth:
    type: apikey
    key: x-api-key
    value: "{{apiKeyDog}}"
    placement: header

runtime:
  scripts:
    - type: after-response
      code: |-
        //bru.setNextRequest(null);

        //const { endChain } = require("./chain-helper.js");
        //endChain(bru);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
